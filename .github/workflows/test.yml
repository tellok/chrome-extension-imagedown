name: Test extension
on: [push, pull_request]
jobs:
  check:
    runs-on:
    - self-hosted
    - tower
    - ubuntu-latest
    - tower-run-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: npm run check && npm test
    - run: pip install -r tests/requirements.txt
    - run: python -m playwright install --with-deps chromium
    - run: python tests/browser_test.py
    - run: python tests/manifest_browser_test.py
    - run: python tests/remote_rules_browser_test.py
    - run: python tests/settings_sync_browser_test.py
    - run: npm run package
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: imagedown-build-and-screenshots
        path: |
          dist/*.zip
          test-results/*.png
